<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINEトーク履歴：月間発言数推移</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: "Helvetica Neue", Arial, sans-serif; margin: 0; padding: 20px; background-color: #f0f2f5; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #00B900; margin-bottom: 30px; }
        .controls { background: #fafafa; padding: 20px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 25px; display: flex; flex-direction: column; gap: 15px; }
        #dateDisplay { font-size: 36px; font-weight: bold; text-align: right; color: #333; font-variant-numeric: tabular-nums; letter-spacing: 2px; }
        .chart-container { position: relative; height: 600px; width: 100%; background: white; }
        .btn-group { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        button { padding: 12px 25px; cursor: pointer; border: none; border-radius: 6px; background: #00B900; color: white; font-weight: bold; transition: 0.2s; }
        button:hover { background: #009e00; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .record-btn { background: #e91e63; }
        .record-btn:hover { background: #c2185b; }
        #loading { text-align: center; font-weight: bold; color: #666; display: none; }
        .status-msg { text-align: center; color: #e91e63; font-weight: bold; margin-top: 10px; min-height: 1.2em; }
    </style>
</head>
<body>

<div class="container">
    <h1>LINE Talk History Monthly Activity</h1>

    <div class="controls">
        <label style="font-weight: bold;">1. LINEのトーク履歴(.txt)を複数選択してください</label>
        <input type="file" id="fileInput" multiple accept=".txt">

        <div id="loading">データを解析中...</div>

        <div class="btn-group">
            <button id="startBtn" disabled>レース再生</button>
            <button id="recordBtn" class="record-btn" disabled>録画して保存</button>
            <button id="resetBtn" disabled>リセット</button>
        </div>
        <div id="statusMsg" class="status-msg"></div>
    </div>

    <div id="dateDisplay">---</div>
    <div class="chart-container">
        <canvas id="myChart"></canvas>
    </div>
</div>

<script>
    let dailyData = {};
    let allDates = [];
    let allNames = [];
    let nameToColor = {};
    let chartInstance = null;
    let animationId = null;
    let currentDateIdx = 0;

    let mediaRecorder;
    let recordedChunks = [];
    let videoExtension = 'webm'; // デフォルト

    const fileInput = document.getElementById('fileInput');
    const startBtn = document.getElementById('startBtn');
    const recordBtn = document.getElementById('recordBtn');
    const resetBtn = document.getElementById('resetBtn');
    const dateDisplay = document.getElementById('dateDisplay');
    const loading = document.getElementById('loading');
    const statusMsg = document.getElementById('statusMsg');

    const colorPalette = ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40', '#8bc34a', '#e91e63', '#00bcd4', '#ffc107'];

    fileInput.addEventListener('change', async (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        loading.style.display = 'block';
        dailyData = {};
        allNames = [];

        for (let i = 0; i < files.length; i++) {
            const name = files[i].name.replace(/\.[^/.]+$/, "");
            allNames.push(name);
            nameToColor[name] = colorPalette[i % colorPalette.length];
            const text = await files[i].text();
            const lines = text.split(/\r\n|\r|\n/);
            let currentFileDate = "";
            const dateRegex = /^(\d{4}\/\d{2}\/\d{2})/;

            lines.forEach(line => {
                const match = line.match(dateRegex);
                if (match) currentFileDate = match[1].substring(0, 7); // YYYY/MM
                if (currentFileDate) {
                    if (!dailyData[currentFileDate]) dailyData[currentFileDate] = {};
                    dailyData[currentFileDate][name] = (dailyData[currentFileDate][name] || 0) + 1;
                }
            });
        }

        allDates = Object.keys(dailyData).sort();

        initChart();
        startBtn.disabled = false;
        recordBtn.disabled = false;
        resetBtn.disabled = false;
        loading.style.display = 'none';
        dateDisplay.innerText = allDates[0];
    });

    function initChart() {
        const ctx = document.getElementById('myChart').getContext('2d');
        if (chartInstance) chartInstance.destroy();

        const initialDate = allDates[0];
        const sortedData = getSortedData(initialDate);

        chartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: sortedData.map(d => d.name),
                datasets: [{
                    data: sortedData.map(d => d.value),
                    backgroundColor: sortedData.map(d => nameToColor[d.name]),
                    borderWidth: 0,
                    borderRadius: 5
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: false,
                animation: {
                    duration: 600, // 入れ替わりの時間を少し長くして視認性をアップ
                    easing: 'easeInOutCubic' // 加速・減速をつけて「抜かされる感」を演出
                },
                scales: {
                    x: { beginAtZero: true },
                    y: { grid: { display: false }, ticks: { font: { size: 16, weight: 'bold' } } }
                },
                plugins: { legend: { display: false } }
            }
        });
    }

    function getSortedData(date) {
        return allNames.map(name => ({
            name: name,
            value: dailyData[date][name] || 0
        })).sort((a, b) => b.value - a.value);
    }

    function updateChart(dateIdx) {
        const date = allDates[dateIdx];
        dateDisplay.innerText = date;
        const sortedData = getSortedData(date);
        chartInstance.data.labels = sortedData.map(d => d.name);
        chartInstance.data.datasets[0].data = sortedData.map(d => d.value);
        chartInstance.data.datasets[0].backgroundColor = sortedData.map(d => nameToColor[d.name]);
        chartInstance.update();
    }

    function startRace(onComplete) {
        // アニメーションのduration(600)と揃えることで、滑らかに連続して動くようにする
        animationId = setInterval(() => {
            if (currentDateIdx < allDates.length - 1) {
                currentDateIdx++;
                updateChart(currentDateIdx);
            } else {
                clearInterval(animationId);
                animationId = null;
                startBtn.innerText = "再生終了";
                if (onComplete) onComplete();
            }
        }, 600);
    }

    startBtn.addEventListener('click', () => {
        if (animationId) {
            clearInterval(animationId);
            animationId = null;
            startBtn.innerText = "再開";
        } else {
            startBtn.innerText = "一時停止";
            startRace();
        }
    });

    recordBtn.addEventListener('click', () => {
        currentDateIdx = 0;
        updateChart(0);
        recordedChunks = [];

        const canvas = document.getElementById('myChart');
        const stream = canvas.captureStream(30);

        // MP4に対応しているかチェックし、対応していればMP4、ダメならWebMを選択
        let options = { mimeType: 'video/webm; codecs=vp9' };
        if (MediaRecorder.isTypeSupported('video/mp4')) {
            options = { mimeType: 'video/mp4' };
            videoExtension = 'mp4';
        } else if (MediaRecorder.isTypeSupported('video/webm; codecs=h264')) {
            options = { mimeType: 'video/webm; codecs=h264' };
            videoExtension = 'webm';
        }

        try {
            mediaRecorder = new MediaRecorder(stream, options);
        } catch (e) {
            // フォールバック
            mediaRecorder = new MediaRecorder(stream);
        }

        mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: options.mimeType || 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `line-race-${new Date().getTime()}.${videoExtension}`;
            a.click();
            statusMsg.innerText = `${videoExtension.toUpperCase()}形式で保存が完了しました！`;
            recordBtn.disabled = false;
        };

        mediaRecorder.start();
        statusMsg.innerText = "録画中... アニメーション終了までお待ちください";
        recordBtn.disabled = true;

        startRace(() => {
            mediaRecorder.stop();
        });
    });

    resetBtn.addEventListener('click', () => {
        clearInterval(animationId);
        animationId = null;
        currentDateIdx = 0;
        startBtn.innerText = "レース再生";
        statusMsg.innerText = "";
        updateChart(0);
    });
</script>

</body>
</html>
